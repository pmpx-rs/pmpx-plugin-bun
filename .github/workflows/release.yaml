name: Release

# Publishing is not idempotent: a crate name and version pair can never be reused,
# and a yanked version cannot be un-yanked. So this workflow is written to refuse
# rather than to guess, and it is safe to re-run after a partial failure because
# publishing a version that is already on the registry counts as done rather than
# as an error.
#
# The checks live in ci.yaml, which this workflow calls. Keeping them in one run is
# what makes the order structural.

on:
  push:
    # The one and only trigger: `v<major>.<minor>.<patch>` tags. Nothing else starts
    # a run, so nothing else can reach the registry, and the shape of a release tag
    # is enforced here rather than by a script that has to remember to check it.
    tags: [ "v*.*.*" ]

# Read-only by default; the publishing job asks for nothing more.
permissions:
  contents: read

jobs:
  # Everything that can be checked without credentials: formatting, clippy, the test
  # suite on three platforms, rustdoc, the package contents, the library name pmpx
  # derives, the absence of an async runtime, and the MSRV build.
  #
  # Calling the whole file means publish waits for every job inside it, matrix
  # included, without listing them again here -- a list would eventually miss one.
  checks:
    name: Checks
    uses: ./.github/workflows/ci.yaml

  # ---------------------------------------------------------------------------
  # crates.io. One crate, one dependency (`pmpx-plugin`, already on the registry),
  # so there is no dependency order inside this repository to respect. The contract
  # crate is a separate repository and has to have been released first -- that
  # ordering cannot be expressed here and is a note in the README instead.
  # ---------------------------------------------------------------------------
  publish:
    name: Publish to crates.io
    needs: [ checks ]
    runs-on: ubuntu-latest
    # No `if:` needed: a tag push is the only way in, so reaching this job at all
    # means a release was asked for, and `needs` means the checks have passed.
    #
    # No `environment:` either, on purpose. Declaring one moves the secret into
    # environment scope and requires that environment to exist before the first run.
    # The token is read from Settings -> Secrets and variables -> Actions.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Install stable toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      # No `rust-cache` here on purpose: this job has nothing worth caching and
      # `cargo publish` verifies in seconds. Restoring the test job's cache is what
      # once led a job like this to clean up a `target/package/` tree it had never
      # created.

      - name: Install the release tool
        run: cargo install harbor --locked

      # Two gates plus a plan in one command: the tag name matches the version in the
      # manifest, the registry token exists and is non-empty, and the publish plan can
      # be computed. Nothing is uploaded until all three hold.
      #
      # The token travels only through an environment variable, never as a command
      # line argument, so it cannot reach the logs by cargo echoing the command line.
      - name: Check the release before starting it
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo harbor check --plan "$GITHUB_REF_NAME"

      # harbor publish will: retry while a dependency has not reached the index yet;
      # treat "the version is already in the registry" as done (so a rerun can finish
      # a half-failed release); and stop immediately on any other error rather than
      # spending the retry budget on a failure that retrying cannot fix.
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo harbor publish
